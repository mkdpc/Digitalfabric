<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --cd:#fff;--hd:#f7f9fc;--hd2:#f1f4f9;
  --ac:#006554;--ac-d:#00443a;--ac-soft:rgba(0,101,84,.07);--ac-ln:rgba(0,101,84,.2);
  --tx:#0e1828;--t2:#5a6478;--t3:#98a1b2;
  --bd:#e6e9f0;--bd2:#eef1f6;
  --gn:#2e7d52;--gn-soft:rgba(46,125,82,.1);
  --or:#c25c20;--or-soft:rgba(194,92,32,.1);
  --rd:#b83232;--rd-soft:rgba(184,50,50,.09);
  --f-poly:#2b6ca3;--f-nylon:#5b4b9e;--f-cotton:#8a6d3b;--f-modal:#a35a86;
  --f-spandex:#c9541f;--f-other:#7d8a85;
}
body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;background:#eef1f6;color:var(--tx);min-height:100vh;font-size:16px}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
a{color:var(--ac);text-decoration:none}
a:hover{text-decoration:underline}

.app{max-width:1480px;margin:24px auto;background:var(--cd);border-radius:14px;overflow:hidden;border:1px solid var(--bd);box-shadow:0 1px 2px rgba(14,24,40,.05)}
.appbar{padding:12px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.appbar .brand{display:flex;align-items:center;gap:14px}
.appbar .navback{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font-size:1.05em;line-height:1;cursor:pointer;transition:background .15s,border-color .15s}
.appbar .navback:hover{background:var(--hd);border-color:var(--ac)}
.appbar .navback.hide{display:none}
.adminbox{margin-top:16px;padding:14px 16px;background:var(--hd);border:1px solid var(--bd);border-radius:11px}
.adopt-ov{position:fixed;inset:0;background:rgba(14,24,40,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.adopt-modal{background:var(--cd);border-radius:14px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(14,24,40,.3);overflow:hidden}
.adopt-modal .am-h{padding:16px 20px;border-bottom:1px solid var(--bd);font-weight:600}
.adopt-modal .am-code{font-family:Consolas,monospace;color:var(--ac)}
.adopt-modal .am-b{padding:18px 20px}
.adopt-modal .am-l{display:block;font-size:.85em;font-weight:600;color:var(--t2);margin-bottom:5px}
.adopt-modal .am-b .tin{width:100%;box-sizing:border-box}
.adopt-modal .am-note{font-size:.82em;color:var(--t3);margin-top:10px;line-height:1.5}
.adopt-modal .am-acts{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--bd)}
.use-block{background:var(--hd);border:1px solid var(--bd);border-radius:11px;padding:16px 18px}
.use-lab{font-size:.74rem;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.use-main{margin-top:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.use-code{font-size:1.5rem;color:var(--ac-d)}
.use-specs{margin-top:15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,220px));gap:16px 28px;justify-content:start}
.use-specs .spec-item .k{font-size:.72rem;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.use-specs .spec-item .v{font-size:.96rem;color:var(--tx)}
.use-specs .spec-bar{margin-top:9px;max-width:210px}
.use-specs .spec-item .v.na{color:var(--t3)}
.sim:hover{background:var(--hd)}
.sim.best:hover{background:var(--ac-soft)}
.compare{margin-top:16px;padding-top:15px;border-top:1px dashed var(--bd)}
.cmp-row{display:flex;gap:14px;align-items:baseline;padding:3px 0}
.cmp-lab{flex:0 0 78px;font-size:.72rem;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.cmp-val{font-size:.93rem;line-height:1.55}
.cmp-orig .cmp-val{color:var(--or);font-weight:600}
.cmp-actual .cmp-val{color:var(--tx)}
.cmp-actual .cmp-val .mono{color:var(--ac-d);font-weight:600}
.cmp-arrow{font-size:.76rem;color:var(--t3);margin:5px 0 5px 92px}
.tbl .hact{display:flex;gap:6px;justify-content:flex-end}
.ic-btn{border:1px solid var(--bd);background:var(--cd);border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:.9rem;line-height:1;padding:0}
.ic-btn:hover{border-color:var(--ac);background:var(--hd)}
.gate-owner-link{margin-top:18px;font-size:.86rem;color:var(--t2)}
.linklike{background:none;border:none;color:var(--ac);cursor:pointer;font-size:inherit;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.linklike:hover{color:var(--ac-d)}
.gate-mode{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;color:var(--ac-d);margin-bottom:8px}
.gate-mode span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--ac);color:#fff}
.owner-setup{margin-top:16px;border-top:1px solid var(--bd);padding-top:14px}
.owner-setup summary{cursor:pointer;color:var(--ac);font-size:.86rem;font-weight:600;list-style-position:inside}
.owner-setup summary:hover{color:var(--ac-d)}
.sim-open{color:var(--ac);font-size:.78rem;font-weight:700;white-space:nowrap}
.badge{width:44px;height:44px;border-radius:12px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.62em;font-weight:700;flex:none}
.appbar .logo{font-size:1.15em;font-weight:600}
.appbar .logo em{color:var(--ac);font-style:normal;font-size:.78em;margin-left:5px;font-weight:600;background:var(--ac-soft);padding:2px 8px;border-radius:5px}
.appbar .right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.appbar .stats{font-size:.82em;color:var(--t2)}
.idchip{display:flex;align-items:center;gap:9px;padding:8px 15px;border-radius:11px;background:var(--hd);border:1px solid var(--bd);font-size:.85em}
.idchip .who{font-weight:600}
.idchip .nm{color:var(--t2)}
.idchip .sw{color:var(--t3);text-decoration:underline;text-underline-offset:2px;font-size:.92em}
.idchip .sw:hover{color:var(--ac)}

.mtabs{border-bottom:1px solid var(--bd);padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.mtabs.hide{display:none}
.mtab{padding:12px 20px;font-size:.92em;color:var(--t2);border-bottom:2.5px solid transparent;font-weight:500;margin-bottom:-1px;white-space:nowrap;border-radius:8px 8px 0 0;transition:.12s;display:flex;align-items:center;gap:7px}
.mtab.a{color:var(--ac);border-bottom-color:var(--ac);background:var(--ac-soft)}
.mtab:hover:not(.a){color:var(--tx);background:var(--hd)}
.mtab .cnt{background:var(--rd);color:#fff;border-radius:10px;padding:1px 7px;font-size:.72em;font-weight:700}

.body{padding:34px clamp(18px,3.6vw,56px) 46px}

h1{font-size:clamp(1.75rem,3.4vw,2.45rem);font-weight:700;letter-spacing:-.02em;line-height:1.15}
h2.sec{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
.lede{margin-top:9px;color:var(--t2);font-size:.9rem}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px 10px 8px 18px;margin-top:24px}
.searchbar:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.searchbar .ic{color:var(--t3);flex:none}
.searchbar input{flex:1;min-width:0;border:none;outline:none;background:none;padding:12px 0;font-size:1.02rem}
.btn{padding:11px 24px;border-radius:9px;background:var(--ac);color:#fff;font-weight:600;font-size:.92rem;white-space:nowrap}
.btn:hover{background:var(--ac-d)}
.btn.ghost{background:var(--cd);border:1px solid var(--bd);color:var(--t2);font-weight:500}
.btn.ghost:hover{border-color:var(--ac);color:var(--ac)}
.btn.gn{background:var(--gn)}.btn.gn:hover{background:#24623f}
.btn.dg{background:var(--rd)}.btn.dg:hover{background:#8f2727}
.btn.sm{padding:8px 15px;font-size:.85rem}
.hint{margin-top:11px;font-size:.83rem;color:var(--t3)}
.hint b{color:var(--t2);font-weight:500}
.hint button{color:var(--ac);font-size:inherit;text-decoration:underline;text-underline-offset:2px}

/* first-use guidance */
.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--ac-d);background:var(--ac-soft);border:1px solid var(--ac-ln);border-radius:999px;padding:6px 11px;font-size:.78rem;font-weight:700;margin-bottom:12px}
.gate-hero{max-width:820px}
.gate-hero h1{max-width:680px}
.gate-hero .lede{font-size:1rem;line-height:1.7;max-width:700px}
.use-cases{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.use-cases span{font-size:.82rem;color:var(--t2);background:var(--hd);border:1px solid var(--bd);border-radius:7px;padding:6px 10px}
.step-label{display:flex;align-items:center;gap:8px;color:var(--ac-d);font-size:.8rem;font-weight:700;margin-bottom:8px}
.step-label b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;font-size:.75rem}
.gate-search{margin-top:26px;padding:20px;background:var(--hd);border:1px solid var(--bd);border-radius:14px}
.gate-search .searchbar{margin-top:10px;background:var(--cd)}
.role-help{font-size:.82rem;color:var(--t2);line-height:1.55;margin-top:4px}
.role-cta{margin-top:9px;color:var(--ac);font-size:.82rem;font-weight:700}
.quickstart{position:relative;margin-bottom:28px;padding:22px;background:linear-gradient(135deg,var(--ac-soft),#fff 72%);border:1px solid var(--ac-ln);border-radius:14px}
.quickstart-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px}
.quickstart-h h2{font-size:1.12rem;margin-bottom:4px}
.quickstart-h p{font-size:.86rem;color:var(--t2)}
.guide-close{color:var(--t2);font-size:.8rem;border:1px solid var(--bd);border-radius:7px;padding:6px 10px;background:#fff;white-space:nowrap}
.guide-close:hover{border-color:var(--ac);color:var(--ac)}
.guide-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.guide-card{background:#fff;border:1px solid var(--bd);border-radius:11px;padding:15px;text-align:left;transition:.15s}
.guide-card:hover{border-color:var(--ac);box-shadow:0 4px 14px rgba(0,101,84,.08);transform:translateY(-1px)}
.guide-card .num{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:7px;background:var(--ac);color:#fff;font-size:.75rem;font-weight:700;margin-bottom:10px}
.guide-card .gt{display:block;font-weight:700;font-size:.92rem}
.guide-card .gd{display:block;color:var(--t2);font-size:.79rem;line-height:1.5;margin-top:4px}
.example-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--hd);color:var(--ac-d);font-family:Consolas,monospace;font-size:.78rem;margin:4px 3px 0 0}
.example-btn:hover{border-color:var(--ac);background:var(--ac-soft)}
.task-block{padding:24px 26px;background:#f3f8f7;border:1px solid #d9e9e5;border-left:5px solid var(--ac);border-radius:14px;box-shadow:0 1px 2px rgba(14,24,40,.03)}
.task-block .searchbar{background:#fff}
.task-block .filters{padding:13px 15px;background:rgba(255,255,255,.74);border:1px solid #dfeae7;border-radius:11px}

/* gate */
.gate-sec{margin-top:44px;padding-top:28px;border-top:1px solid var(--bd)}
.gate-sec .d{margin-top:6px;font-size:.88rem;color:var(--t2)}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(266px,1fr));gap:16px;margin-top:20px}
.ocard{background:var(--cd);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:11px;padding:20px 22px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:156px;transition:.15s;position:relative}
.ocard:hover{box-shadow:0 6px 22px rgba(14,24,40,.09);transform:translateY(-2px)}
.ocard .dot{width:9px;height:9px;border-radius:50%;background:var(--ac)}
.ocard .arw{position:absolute;top:17px;right:19px;color:var(--t3)}
.ocard:hover .arw{color:var(--ac)}
.ocard .nm{font-size:1.2rem;font-weight:700;margin-top:9px}
.ocard .sc{font-size:.83rem;color:var(--t2)}
.ocard .ow{margin-top:auto;padding-top:14px;border-top:1px solid var(--bd2);display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ocard .ow .k{font-size:.7rem;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.ocard .ow .v{font-weight:700;font-size:.95rem}
.ocard .ow .v.unset{color:var(--rd);font-size:.86rem}
.ocard.member{border-left-color:var(--t3)}
.ocard.member .dot{background:var(--t3)}
.ocard.member .nm{font-weight:600;font-size:1.08rem}
.setname{margin-top:16px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:.86rem;color:var(--t2)}
.setname input{padding:9px 13px;border:1px solid var(--bd);border-radius:9px;outline:none;min-width:190px}
.setname input:focus{border-color:var(--ac)}

/* chips + filters */
.filters{margin-top:20px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.filters .lab,.lab{font-size:.83rem;color:var(--t2)}
.chip{padding:8px 16px;border-radius:20px;border:1px solid var(--bd);background:var(--cd);font-size:.86rem;color:var(--t2);display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--ac-ln);color:var(--ac)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.chip.soft.on{background:var(--ac-soft);color:var(--ac-d);border-color:var(--ac)}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip .n{opacity:.62;font-size:.9em}
.adv-toggle{margin-top:14px;font-size:.85rem;color:var(--t2)}
.adv-toggle:hover{color:var(--ac)}
.adv{display:none;margin-top:13px;padding:15px 17px;background:var(--hd);border:1px solid var(--bd);border-radius:11px}
.adv.open{display:block}
.adv-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.adv-row+.adv-row{margin-top:12px}
.pick{background:var(--cd);border:1px solid var(--bd);border-radius:9px;padding:9px 12px;outline:none}
.pick:focus{border-color:var(--ac)}
.tin{background:var(--cd);border:1px solid var(--bd);border-radius:9px;padding:9px 13px;outline:none}
.tin:focus{border-color:var(--ac)}

.zone{margin-top:22px;padding:22px 24px;border:1px solid var(--bd);border-radius:14px;background:var(--hd)}
.zone.adopted-zone{background:#fff8f1;border-color:#f0dfcc;border-left:5px solid var(--or)}
.zone.library-zone{background:#f5f8fc;border-color:#dde5f0;border-left:5px solid var(--f-poly)}
.zone.result-zone{background:#f5f8fc;border-color:#dde5f0;border-left:5px solid var(--f-poly)}
.zone-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:15px}
.zone-h .t{font-size:.95rem;font-weight:600}
.zone-h .n{font-size:.85rem;color:var(--t2)}
.zone-h .n b{color:var(--tx)}
.link{font-size:.84rem;color:var(--t2);text-decoration:underline;text-underline-offset:2px}
.link:hover{color:var(--ac)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:12px}
.fcard{background:var(--cd);border:1px solid var(--bd);border-radius:11px;padding:15px 16px;text-align:left;transition:.14s;display:flex;flex-direction:column;gap:9px;min-height:116px}
.fcard:hover{border-color:var(--ac);box-shadow:0 3px 14px rgba(0,101,84,.09);transform:translateY(-1px)}
.fcard .code{font-family:Consolas,monospace;font-weight:600;font-size:1rem;color:var(--ac-d);word-break:break-all;line-height:1.25}
.fcard .line{font-size:.83rem;color:var(--t2);line-height:1.45}
.fcard .line b{color:var(--tx);font-weight:600}
.fcard .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.fcard .gsm{font-family:Consolas,monospace;font-size:.85rem;font-weight:600}
.fcard .gsm.na{color:var(--t3);font-weight:400}
.bar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--bd2)}
.bar i{display:block;height:100%}
.pill{font-size:.68rem;padding:2px 7px;border-radius:5px;font-weight:600}
.pill.knit{background:var(--ac-soft);color:var(--ac-d)}
.pill.woven{background:rgba(43,108,163,.09);color:#2b6ca3}
.pill.miss{background:var(--rd-soft);color:var(--rd)}
.pill.act{background:var(--gn-soft);color:var(--gn)}
.pill.rec{background:var(--or-soft);color:var(--or)}

.back{font-size:.86rem;color:var(--t2);padding:7px 14px;border:1px solid var(--bd);border-radius:9px;margin-bottom:16px;display:inline-block}
.back:hover{border-color:var(--ac);color:var(--ac)}
.qbar{display:flex;align-items:center;gap:11px;background:var(--hd);border:1px solid var(--bd);border-radius:10px;padding:10px 15px;margin-bottom:18px;flex-wrap:wrap}
.qbar .lab{color:var(--t3);font-size:.8rem}
.qbar .val{font-family:Consolas,monospace;font-weight:600}
.qbar .clr{margin-left:auto;font-size:.82rem;color:var(--t2);text-decoration:underline}
.qbar .clr:hover{color:var(--rd)}

.panel{background:var(--cd);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.panel-h{padding:20px 22px;border-bottom:1px solid var(--bd2);background:var(--hd);display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.panel-h .code{font-family:Consolas,monospace;font-size:1.42rem;font-weight:600;color:var(--ac-d);word-break:break-all}
.panel-b{padding:20px 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,200px));gap:18px 32px;justify-content:start;align-items:start}
.fld .k{font-size:.71rem;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.fld .v{font-size:.93rem}
.fld .v.na{color:var(--t3)}
.tag{font-size:.75rem;padding:3px 9px;border-radius:6px;background:var(--hd2);border:1px solid var(--bd);color:var(--t2);margin-right:5px;display:inline-block}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--bd2)}
.acts .btn.ghost{padding:9px 16px;font-size:.85rem}

.simhead{font-size:.79rem;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin:24px 0 10px}
.sim{display:grid;grid-template-columns:50px minmax(280px,340px) 1fr 74px auto;gap:13px;align-items:center;padding:12px;border-radius:9px;text-align:left;width:100%;border:1px solid transparent}
.sim:hover{background:var(--hd);border-color:var(--bd)}
.sim.best{background:var(--ac-soft);border-color:var(--ac-ln)}
.sim.best:hover{border-color:var(--ac)}
.score{font-family:Consolas,monospace;font-size:.83rem;font-weight:700;text-align:center;padding:4px 0;border-radius:6px}
.score.hi{background:var(--gn-soft);color:var(--gn)}
.score.mid{background:var(--or-soft);color:var(--or)}
.score.lo{background:var(--hd2);color:var(--t3)}
.sim .c{font-family:Consolas,monospace;font-weight:600;font-size:.87rem;color:var(--ac-d);word-break:break-all}
.sim .best-tag{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:5px;background:var(--ac);color:#fff;font-family:'Segoe UI','Microsoft JhengHei',sans-serif;font-size:.68rem;vertical-align:1px}
.sim .comp{display:block;margin-top:5px;font-size:.8rem;line-height:1.45;color:var(--tx);font-family:'Segoe UI','Microsoft JhengHei',sans-serif}
.sim .comp.na{color:var(--t3)}
.sim .why{font-size:.82rem;color:var(--t2)}
.sim .g{font-family:Consolas,monospace;font-size:.81rem;color:var(--t2);text-align:right}
.note{font-size:.79rem;color:var(--t3);margin-top:11px;line-height:1.55}

<script>
'use strict';

/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  VERSION: '2.3.0',
  UNC: '\\\\192.168.1.220\\3ddb\\Fabric Library',
  HOME_URL: '',        // 品牌總覽頁網址
  BRAND_MATCH: ['DICKS','DICK S','DSG','DICKS SPORTING GOODS'],
  PREFIX: 'dsgfab1:',
  MAIL_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbx5KUfppgbnSQWBBkg8FY2QvoHMAVEXTFcHWxMccMWMF3f9DH4F5IrS1UDkJe8sgLk/exec',
  OWNER: { brand:"DICK'S", scope:'Main line', name:'' },  // 雲端 config 有值時以雲端為準
  // ── Firebase RTDB（跟 GAP 版同一個專案，DSG 用獨立節點，不碰 GAP 的 fabrics/styles/history）
  FB: {
    base: 'https://dpc-fabric-libaray-default-rtdb.firebaseio.com',
    fabrics: 'dsg_fabrics',    // per-key，不是整包陣列 → 不會被別人存檔蓋掉
    styles:  'dsg_styles',
    history: 'dsg_history',
    pending: 'dsg_pending',
    config:  'dsg_config'
  }
};

/* ============================================================
   SEED —— 公檔中 originating brand = DICK'S 的 19 筆
   ============================================================ */
const SEED = [
  {code:'320355-W',        type:'Woven', sub:'Ripstop',       comp:'89% Polyester, 11% Spandex',            gsm:null, src:['scan']},
  {code:'AW-0900',         type:'Woven', sub:'Plain Weave',   comp:'89% Polyester, 11% Spandex',            gsm:125,  src:['scan']},
  {code:'AW-1164',         type:'Woven', sub:'Plain Weave',   comp:'92% Polyester, 8% Spandex',             gsm:94,   src:['scan']},
  {code:'KOI18278-C1',     type:'Woven', sub:'Scuba',         comp:'47% Polyester, 43% Modal, 10% Spandex', gsm:320,  src:['scan']},
  {code:'LTC32676',        type:'Woven', sub:'Stretch Dobby', comp:'89% Nylon, 11% Spandex',                gsm:170,  src:['scan']},
  {code:'PT-WX-24558',     type:'Woven', sub:'Scuba',         comp:'76% Polyester, 24% Spandex',            gsm:280,  src:['scan']},
  {code:'T15867',          type:'Woven', sub:null,            comp:null,                                    gsm:208,  src:['scan']},
  {code:'119556-DWR',      type:'Woven', sub:'Plain Weave',   comp:'100% Nylon',                            gsm:110,  src:['scan']},

  {code:'PT-WX-15442',     type:'Knit',  sub:'Jersey',        comp:'100% Polyester',                        gsm:105,  src:['scan']},
  {code:'PT-WX-18286',     type:'Knit',  sub:'Jacquard',      comp:'76% Nylon, 24% Spandex',                gsm:240,  src:['scan']},
  {code:'PT-WX-19341',     type:'Knit',  sub:'Double Knit',   comp:'70% Nylon, 30% Spandex',                gsm:250,  src:['scan']},
  {code:'PT-WX-34692',     type:'Knit',  sub:'Interlock',     comp:'84% Polyester, 16% Spandex',            gsm:190,  src:['scan']},
  {code:'PTM-090-7',       type:'Knit',  sub:'Tricot',        comp:'100% Polyester',                        gsm:115,  src:['scan']},
  {code:'S618006-W',       type:'Knit',  sub:'Jersey',        comp:'79% Polyester, 21% Spandex',            gsm:190,  src:['scan']},
  {code:'WJ-1333',         type:'Knit',  sub:'Circular Knit', comp:'75% Nylon, 25% Spandex',                gsm:200,  src:['scan']},
  {code:'TY-255165',       type:'Knit',  sub:'Jacquard',      comp:'100% Polyester',                        gsm:450,  src:['scan']}
];

/* ============================================================
   STORE
   ============================================================ */
const Store = {
  get(k){ try{ const v = localStorage.getItem(CONFIG.PREFIX+k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(CONFIG.PREFIX+k, JSON.stringify(v)); return true; }catch(e){ toast('儲存空間已滿','rd'); return false; } },
  del(k){ try{ localStorage.removeItem(CONFIG.PREFIX+k); }catch(e){} },
  list(pre){
    const out = [];
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(CONFIG.PREFIX+pre)) out.push(k.slice(CONFIG.PREFIX.length));
      }
    }catch(e){}
    return out.sort();
  }
};

/* ============================================================
   FIREBASE —— 多人共用層
   fabrics / styles / pending / config 走 per-key PUT、DELETE
   history 走 POST（append-only），雲端為單一真實來源
   ============================================================ */
const Sync = {
  status:'connecting',   // connecting | ok | offline
  lastAt:null, lastError:null, log:[],
  _log(kind,msg){ this.log.unshift({ ts:new Date().toLocaleTimeString('zh-TW',{hour12:false}), kind, msg }); this.log = this.log.slice(0,30); },
  ok(msg){ this.status='ok'; this.lastAt=new Date(); this.lastError=null; if(msg) this._log('ok',msg); },
  fail(e){ this.status='offline'; this.lastError=String(e&&e.message||e); this._log('err', this.lastError); }
};
// Firebase key 不能含 . $ # [ ] /
function fbKey(s){ return String(s||'').replace(/[.#$\[\]\/]/g,'_'); }
function fbUrl(node, key){
  return CONFIG.FB.base + '/' + node + (key !== undefined && key !== null ? '/' + encodeURIComponent(fbKey(key)) : '') + '.json';
}
function fbPut(node, key, val){
  return fetch(fbUrl(node,key), { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(val) })
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); Sync.ok(); })
    .catch(e => { Sync.fail(e); });
}
function fbDel(node, key){
  return fetch(fbUrl(node,key), { method:'DELETE' })
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); Sync.ok(); })
    .catch(e => { Sync.fail(e); });
}
function fbPost(node, val){
  return fetch(fbUrl(node), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(val) })
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); Sync.ok(); })
    .catch(e => { Sync.fail(e); });
}
function fbGet(node){
  return fetch(fbUrl(node)).then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}

/* ── 拉取 ───────────────────────────────────────────── */
async function pullFabrics(){
  const d = await fbGet(CONFIG.FB.fabrics);
  if(d && typeof d === 'object'){
    const arr = Object.values(d).filter(Boolean);
    if(arr.length){ DATA = arr.map(decorate); Store.set('fabrics', arr); return arr.length; }
  }
  return 0;
}
async function pullStyles(){
  const d = await fbGet(CONFIG.FB.styles);
  // 雲端為準：先清掉本機 style:，再寫入雲端版本，這樣刪除才會傳播
  Store.list('style:').forEach(k => Store.del(k));
  let n = 0;
  if(d && typeof d === 'object'){
    Object.entries(d).forEach(([k,v]) => { if(v){ Store.set('style:'+(v.styleKey||k), v); n++; } });
  }
  return n;
}
async function pullHistory(){
  const d = await fbGet(CONFIG.FB.history);
  if(d && typeof d === 'object'){
    const remote = Object.entries(d).map(([id,v]) => Object.assign({ fbid:id }, v)).filter(x => x.action);
    const rkeys = new Set(remote.map(h => h.id || (h.iso+'|'+h.action+'|'+h.code)));
    const now = Date.now();
    const local = (Store.get('history')||[]).filter(h =>
      h && !rkeys.has(h.id || (h.iso+'|'+h.action+'|'+h.code)) && (now - Date.parse(h.iso||0) < 5*60*1000));
    const merged = remote.concat(local).sort((a,b) => Date.parse(b.iso||0) - Date.parse(a.iso||0));
    Store.set('history', merged.slice(0,1200));
    return merged.length;
  }
  Store.set('history', []);
  return 0;
}
async function pullPending(){
  const d = await fbGet(CONFIG.FB.pending);
  const list = (d && typeof d === 'object') ? Object.values(d).filter(Boolean) : [];
  list.sort((a,b) => Date.parse(b.iso||0) - Date.parse(a.iso||0));
  Store.set('pendingRequests', list);
  return list.length;
}
async function pullConfig(){
  const d = await fbGet(CONFIG.FB.config);
  if(d && typeof d === 'object'){
    if(d.ownerName) CONFIG.OWNER.name = d.ownerName;
    if(d.ownerScope) CONFIG.OWNER.scope = d.ownerScope;
    if(typeof d.mailScriptUrl === 'string' && d.mailScriptUrl) CONFIG.MAIL_SCRIPT_URL = d.mailScriptUrl;
  }
}
let _pulling = false, _lastPull = 0;
async function pullAll(force){
  if(_pulling) return;
  if(!force && Date.now() - _lastPull < 15000) return;
  _pulling = true; _lastPull = Date.now();
  Sync.status = 'connecting'; renderBar();
  try{
    await pullConfig();
    const nf = await pullFabrics();
    await pullStyles(); await pullHistory(); await pullPending();
    Sync.ok('已拉取雲端資料' + (nf ? '（布料 ' + nf + ' 筆）' : '（雲端尚無布料，使用本機 ' + DATA.length + ' 筆）'));
  }catch(e){ Sync.fail(e); }
  _pulling = false;
  render();
}

/* ── 推送 ───────────────────────────────────────────── */
function pushFabric(f){ fbPut(CONFIG.FB.fabrics, f.key, { code:f.code, type:f.type, sub:f.sub, comp:f.comp, gsm:f.gsm, src:f.src }); }
function pushAllFabrics(){
  const payload = {};
  DATA.forEach(f => { payload[fbKey(f.key)] = { code:f.code, type:f.type, sub:f.sub, comp:f.comp, gsm:f.gsm, src:f.src }; });
  return fbPut(CONFIG.FB.fabrics, null, payload);
}
function saveStyle(key, val){
  val.styleKey = key;
  Store.set('style:'+key, val);
  fbPut(CONFIG.FB.styles, key, val);
}
function removeStyle(key){
  Store.del('style:'+key);
  fbDel(CONFIG.FB.styles, key);
  // 一併清掉雲端該款號的歷史，避免重整後又同步回來
  fbGet(CONFIG.FB.history).then(d => {
    if(!d || typeof d !== 'object') return;
    Object.entries(d).forEach(([id,v]) => {
      if(v && (v.styleKey === key || (v.style && (v.style + (v.bom?'_'+v.bom:'')) === key))) fbDel(CONFIG.FB.history, id);
    });
  }).catch(()=>{});
}
function savePending(r){ Store.set('pendingRequests', Store.get('pendingRequests')||[]); fbPut(CONFIG.FB.pending, r.id, r); }
/* 找不到布 → 用公司信箱寄信給 DICK'S 負責人（沿用 GAP 的 Apps Script → Power Automate，品牌參數 dsg）*/
function notifyEmail(code, msg, fromUser){
  if(!CONFIG.MAIL_SCRIPT_URL){ toast('尚未設定寄信服務網址','or'); return; }
  try{
    const cb='dsgmail_'+Date.now()+Math.floor(Math.random()*1000);
    let done=false;
    const cleanup=()=>{ try{ delete window[cb]; }catch(e){} if(sc.parentNode) sc.parentNode.removeChild(sc); };
    window[cb]=function(res){
      done=true;
      if(res && res.ok){ toast('✅ 已寄信通知負責人'+(res.to?(' '+res.to):''),'gn'); }
      else { toast('⚠ 通知已記錄，但寄信未成功'+(res&&res.error?('：'+res.error):'')+'（負責人仍會在待處理請求看到）','or'); }
      cleanup();
    };
    const p=new URLSearchParams({ brand:'dsg', query:code||'', message:msg||'', fromUser:fromUser||'成員',
      ts:new Date().toLocaleString('zh-TW',{hour12:false}), callback:cb });
    var sc=document.createElement('script');
    sc.src=CONFIG.MAIL_SCRIPT_URL+'?'+p.toString();
    sc.onerror=function(){ if(!done){ toast('⚠ 連不上寄信服務，但通知已記錄','or'); } cleanup(); };
    document.body.appendChild(sc);
    setTimeout(()=>{ if(!done){ toast('⚠ 寄信服務逾時沒回應，但通知已記錄','or'); cleanup(); } }, 15000);
  }catch(e){}
}
function saveConfigField(k, v){ fbPut(CONFIG.FB.config, k, v); }

/* ============================================================
   纖維 / 解析
   ============================================================ */
const FIBER_COLOR = {POLYESTER:'var(--f-poly)',NYLON:'var(--f-nylon)',COTTON:'var(--f-cotton)',MODAL:'var(--f-modal)',SPANDEX:'var(--f-spandex)'};
const FIBER_ZH = {POLYESTER:'聚酯',NYLON:'尼龍',COTTON:'棉',MODAL:'莫代爾',SPANDEX:'彈性'};
function fiberColor(f){ return FIBER_COLOR[f] || 'var(--f-other)'; }
function normFiber(name){
  const s = String(name||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(/POLYESTER|POLY|PET|RPET/.test(s)) return 'POLYESTER';
  if(/NYLON|POLYAMIDE|^PA$/.test(s))    return 'NYLON';
  if(/COTTON|BCI/.test(s))              return 'COTTON';
  if(/MODAL/.test(s))                   return 'MODAL';
  if(/SPANDEX|ELASTANE|LYCRA|ELAST/.test(s)) return 'SPANDEX';
  return s || 'OTHER';
}
function parseComp(str){
  if(!str) return [];
  const out = [], re = /(\d+(?:\.\d+)?)\s*%\s*([A-Za-z][A-Za-z\s\-()]*)/g;
  let m;
  while((m = re.exec(str)) !== null){
    const f = normFiber(m[2]), p = parseFloat(m[1]);
    const hit = out.find(o => o.f === f);
    if(hit) hit.p += p; else out.push({ f, p });
  }
  return out.sort((a,b) => b.p - a.p);
}
function hasSpandex(fs){ return fs.some(x => x.f === 'SPANDEX'); }
// 布號沒有命名規範 → 只做大小寫/空白/分隔符正規化，不解析前後綴
function normCode(s){ return String(s||'').toUpperCase().replace(/[\s_\u2013\u2014]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,''); }
function decorate(f){
  const fs = parseComp(f.comp);
  return Object.assign({}, f, { fibers:fs, spandex:hasSpandex(fs), key:normCode(f.code),
    incomplete: !f.sub || !f.comp || f.gsm == null });
}

/* ============================================================
   相似度（SOP）
   成分為主 60 分、布種 20 分、克重 25 分，缺值扣分
   ============================================================ */
const SOP = { compMax:60, typeSame:0, typeCross:20, subDiff:9, weightMax:25, missComp:30, missSub:8, missGsm:10 };
function similarity(a, b){
  const why = [];
  const keys = new Set([...a.fibers.map(x=>x.f), ...b.fibers.map(x=>x.f)]);
  let dist = 0;
  keys.forEach(k => {
    const pa = (a.fibers.find(x=>x.f===k)||{p:0}).p;
    const pb = (b.fibers.find(x=>x.f===k)||{p:0}).p;
    dist += Math.abs(pa - pb);
  });
  let score = 100;
  if(a.fibers.length && b.fibers.length){
    score -= Math.min(SOP.compMax, dist * 0.3);
    if(dist === 0) why.push('成分完全相同');
    else if(dist <= 10) why.push('成分差 ' + dist.toFixed(0) + ' 點');
    else {
      const af = a.fibers.map(x=>x.f).sort().join('+');
      const bf = b.fibers.map(x=>x.f).sort().join('+');
      why.push(af === bf ? '同纖維、比例差 ' + dist.toFixed(0) + ' 點' : '纖維組成不同');
    }
  } else { score -= SOP.missComp; why.push('成分不全'); }

  if(a.sub && b.sub){
    if(a.sub.toUpperCase() === b.sub.toUpperCase()) why.push('同布種');
    else if(a.type === b.type){ score -= SOP.subDiff; why.push(b.sub); }
    else { score -= SOP.typeCross; why.push('跨' + (b.type==='Knit'?'針織':'梭織')); }
  } else { score -= SOP.missSub; why.push('布種未填'); }

  if(a.gsm != null && b.gsm != null){
    const d = Math.abs(a.gsm - b.gsm);
    score -= Math.min(SOP.weightMax, (d / Math.max(a.gsm, b.gsm)) * 70);
    why.push(d === 0 ? '克重相同' : '克重差 ' + d + 'g');
  } else { score -= SOP.missGsm; why.push('克重未填'); }

  return { score: Math.max(0, Math.round(score)), why: why.join('・') };
}
function rankAgainst(target, pool){
  return pool.filter(f => f.key !== target.key)
    .map(f => Object.assign({ f }, similarity(target, f)))
    .sort((x,y) => y.score - x.score);
}
const SUBS_DICT = ['Single Jersey','Double Knit','Circular Knit','Plain Weave','Stretch Dobby','Interlock','Jacquard','Ripstop','Jersey','Tricot','Scuba','Dobby','Twill','Mesh','Fleece','Terry','Rib','Ponte','Poplin','Canvas','Softshell','Bonded','Air Layer','Powermesh'];
function parseSpec(text){
  const t = String(text||'').trim();
  if(!t) return null;
  const comp = parseComp(t);
  const gm = t.match(/(\d{2,4})\s*(?:gsm|g\/m2|g\/m²|g\/m|克)/i);
  const gsm = gm ? parseInt(gm[1],10) : null;
  let sub = null;
  for(const s of SUBS_DICT){ if(new RegExp(s.replace(/\s+/g,'\\s*'),'i').test(t)){ sub = s; break; } }
  const KNIT = /jersey|tricot|interlock|knit|rib|fleece|terry|ponte|mesh|jacquard|powermesh/i;
  const type = sub ? (KNIT.test(sub) ? 'Knit' : 'Woven') : null;
  if(!comp.length && gsm == null && !sub) return null;
  return { code:'（查詢規格）', key:'__SPEC__', type, sub, comp:t, gsm, fibers:comp, spandex:hasSpandex(comp), src:[] };
}

function toast(msg, kind){
  const el = $('toast');
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2400);

function copy(text, msg){
  const ok = () => toast(msg || '已複製', 'gn');
  const fb = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); ok(); }catch(e){ toast('複製失敗，請手動選取','rd'); }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok).catch(fb);
  else fb();
}

   ============================================================ */
function visible(){
  const S = State.search;
  let out = DATA.slice();
  const q = S.q.trim().toUpperCase();
  if(q) out = out.filter(f =>
    f.key.includes(normCode(q)) || f.code.toUpperCase().includes(q) ||
    (f.sub||'').toUpperCase().includes(q) || (f.comp||'').toUpperCase().includes(q));
  if(S.type !== 'all') out = out.filter(f => f.type === S.type);
  if(S.gsm !== 'all'){
    const p = S.gsm.split('-').map(Number);
    out = out.filter(f => f.gsm != null && f.gsm >= p[0] && f.gsm < p[1]);
  }
  if(S.fibers.size) out = out.filter(f => [...S.fibers].every(k => f.fibers.some(x => x.f === k)));
  out.sort((a,b) => {
    if(S.sort === 'gsm'){ if(a.gsm==null) return 1; if(b.gsm==null) return -1; return a.gsm - b.gsm; }
    if(S.sort === 'sub') return (a.sub||'zzz').localeCompare(b.sub||'zzz');
    return a.code.localeCompare(b.code, undefined, { numeric:true });
  });
  return out;
}
function filterActive(){
  const S = State.search;
  return !!(S.type !== 'all' || S.gsm !== 'all' || S.fibers.size);
}

function runSearch(){
  const q = State.search.q.trim();
  if(!q){ State.search.result = null; render(); return; }
  // 1) 款號 —— 先比對完整款號 key（精準命中優先），再比對前綴
  const exactStyle = Store.list('style:').find(k => k.slice(6).toUpperCase() === q.toUpperCase());
  if(exactStyle){ State.search.result = { kind:'style', key:exactStyle.slice(6) }; render(); return; }
  const styleKeys = Store.list('style:').filter(k => k.slice(6).toUpperCase().startsWith(q.toUpperCase()));
  if(styleKeys.length === 1){ State.search.result = { kind:'style', key:styleKeys[0].slice(6) }; render(); return; }
  // 2) 布號完全命中
  const exact = findFabric(q);
  if(exact){ State.search.result = { kind:'fabric', code:exact.code }; render(); return; }
  // 3) 關鍵字命中多筆
  const qq = q.toUpperCase(), qk = normCode(q);
  const list = DATA.filter(f => f.key.includes(qk) || (f.sub||'').toUpperCase().includes(qq) || (f.comp||'').toUpperCase().includes(qq));
  if(list.length === 1){ State.search.result = { kind:'fabric', code:list[0].code }; render(); return; }
  if(list.length > 1){ State.search.result = { kind:'multi', q, list }; render(); return; }
  // 4) 看起來是規格 → 直接推薦
  const spec = parseSpec(q);
  if(spec && (spec.fibers.length || spec.gsm != null)){
    State.search.result = { kind:'spec', q, target:spec, ranked:rankAgainst(spec, DATA) }; render(); return;
  }
  // 5) 找不到
  State.search.result = { kind:'none', q }; render();
  if(!isAdmin() && !(State.identity && State.identity.name)) openMemberNamePicker();
}

const COL_HINTS = {
  style: /dev\.?\s*style|style\s*#|style\s*no|款號|款式/i,
  bom:   /bom/i,
  code:  /fabric\s*(code|#|no)|material\s*(code|#|no)|布號|料號|supplier\s*ref/i,
  comp:  /composition|content|fiber|成分/i,
  gsm:   /weight|gsm|g\/m|克重/i,
  sub:   /fabric\s*type|construction|布種|織法/i,
  season:/season|季/i
};
function detectCols(header){
  const cols = {};
  header.forEach((h, i) => {
    const s = String(h||'').trim();
    if(!s) return;
    for(const k in COL_HINTS){ if(cols[k] === undefined && COL_HINTS[k].test(s)) cols[k] = i; }
  });
  return cols;
}
function buildExcelRows(){
  const X = State.excel;
  const rows = [];
  for(let i = X.headerIdx + 1; i < X.raw.length; i++){
    const r = X.raw[i];
    if(!r || r.every(c => c === '' || c == null)) continue;
    const cell = k => (X.cols[k] === undefined ? '' : String(r[X.cols[k]] ?? '').trim());
    const code = cell('code'), comp = cell('comp'), sub = cell('sub');
    const gsmRaw = cell('gsm');
    const gsm = gsmRaw ? (parseInt(String(gsmRaw).replace(/[^\d]/g,''),10) || null) : null;
    const specText = [sub, comp, gsm ? gsm+'gsm' : ''].filter(Boolean).join(' ');
    let status = 'empty', match = null, cands = [];
    if(code){
      match = findFabric(code);
      if(match) status = 'actual';
      else {
        const t = parseSpec(specText);
        if(t && (t.fibers.length || t.gsm != null)){ status = 'recommend'; cands = rankAgainst(t, DATA).slice(0,5); }
        else status = 'empty';
      }
    } else {
      const t = parseSpec(specText);
      if(t && (t.fibers.length || t.gsm != null)){ status = 'recommend'; cands = rankAgainst(t, DATA).slice(0,5); }
    }
    const style = cell('style');
    const bom = cell('bom');
    const key = style ? (style + (bom ? '_' + bom : '')) : '';
    rows.push({ idx:rows.length, style, bom, key, code, comp, sub, gsm, season:cell('season'),
                specText, status, matchCode: match ? match.code : null, cands,
                committed: key ? !!Store.get('style:'+key) : false, picked:null });
  }
  X.rows = rows;
}

/* ===== 瀏覽器上一頁／返回整合（SPA history）——讓「上一步」在每個畫面都能用 ===== */
let _navSuppress=false, _lastSig=null;
function _sig(){
  if(!State.identity) return 'gate';
  const r=State.search.result;
  return State.tab+'|'+(r?(r.kind+':'+(r.key||r.code||r.q||'')):'');
}
function _snap(){
  const r=State.search.result;
  return { __dsg:true, tab:State.tab, q:State.search.q, result: r?{kind:r.kind, key:r.key, code:r.code, q:r.q}:null };
}
function _syncHistory(){
  if(_navSuppress) return;
  if(!State.identity){ _lastSig=null; return; }
  const sig=_sig();
  if(sig===_lastSig) return;
  const snap=_snap();
  try{ if(_lastSig===null) history.replaceState(snap,''); else history.pushState(snap,''); }catch(e){}
  _lastSig=sig;
}
function _restoreHist(st){
  if(!st || !st.__dsg) return;
  if(!State.identity) return;
  _navSuppress=true;
  State.tab = st.tab || 'search';
  const r = st.result;
  if(!r){ State.search.result=null; if(st.q!=null) State.search.q=st.q; render(); }
  else if(r.kind==='style'){ State.search.result={kind:'style',key:r.key}; render(); }
  else if(r.kind==='fabric'){ State.search.result={kind:'fabric',code:r.code}; render(); }
  else { State.search.q = r.q||''; runSearch(); }
  _lastSig=_sig();
  _navSuppress=false;
}
window.addEventListener('popstate', function(e){ _restoreHist(e.state); });

function render(){
  renderBar(); renderTabs();
  const host = $('tab-content');
  if(!State.identity)              host.innerHTML = viewGate();
  else if(State.tab === 'excel')   host.innerHTML = viewExcel();
  else if(State.tab === 'pending') host.innerHTML = viewPending();
  else if(State.tab === 'history') host.innerHTML = viewHistory();
  else if(State.tab === 'settings') host.innerHTML = viewSettings();
  else                             host.innerHTML = viewSearch();
  attach();
  _syncHistory();
}
function refreshList(){
  const z = $('zone');
  if(!z) return;
  z.innerHTML = zoneHTML();
  bindCommon(z);
}

function bindCommon(scope){
  scope.querySelectorAll('[data-open]').forEach(b => b.onclick = e => {
    if(e.target.closest('[data-pick],[data-adopt-sub],[data-adopt-main],[data-adopt-acc]')) return;
    State.search.result = { kind:'fabric', code:b.dataset.open };
    State.tab = 'search'; render(); window.scrollTo({top:0,behavior:'smooth'});
  });
  scope.querySelectorAll('[data-style]').forEach(b => b.onclick = e => {
    e.preventDefault();
    State.search.result = { kind:'style', key:b.dataset.style };
    State.tab = 'search'; render(); window.scrollTo({top:0,behavior:'smooth'});
  });
  const rst = $('reset');
  if(rst) rst.onclick = () => { const S = State.search; S.type='all'; S.gsm='all'; S.fibers.clear(); render(); };
  const exp = $('exp'); if(exp) exp.onclick = exportFabrics;
}

function attach(){
  const host = $('tab-content');
  bindCommon(host);

  /* gate */
  host.querySelectorAll('[data-role]').forEach(b => b.onclick = () => {
    const role = b.dataset.role;
    if(role === 'owner' && !CONFIG.OWNER.name){
      const inp = $('ownname'), v = inp ? inp.value.trim() : '';
      if(!v){ toast('先輸入負責人姓名','or'); if(inp) inp.focus(); return; }
      setIdentity('owner', v); return;
    }
    setIdentity(role, role === 'owner' ? CONFIG.OWNER.name : '');
  });
  const os = $('ownsave');
  if(os) os.onclick = () => {
    const v = $('ownname').value.trim();
    if(!v){ toast('先輸入負責人姓名','or'); return; }
    setIdentity('owner', v);
  };
  const gq = $('gateq');
  if(gq){
    const g = () => {
      const v = gq.value.trim();
      if(!v){ toast('請先輸入布號或原布規格','or'); gq.focus(); return; }
      setIdentity('member',''); State.search.q = v; runSearch();
    };
    gq.onkeydown = e => { if(e.key === 'Enter') g(); };
    $('gatego').onclick = g;
    host.querySelectorAll('[data-gate-example]').forEach(b => b.onclick = () => {
      gq.value = b.dataset.gateExample;
      g();
    });
  }

  /* search */
  const q = $('q');
  if(q){
    q.oninput = e => { State.search.q = e.target.value; };
    q.onkeydown = e => { if(e.key === 'Enter') runSearch(); };
    host.querySelectorAll('[data-example]').forEach(b => b.onclick = () => {
      State.search.q = b.dataset.example;
      q.value = State.search.q;
      runSearch();
    });
  }
  host.querySelectorAll('[data-quick]').forEach(b => b.onclick = () => {
    const action = b.dataset.quick;
    if(action === 'excel'){ State.tab = 'excel'; render(); return; }
    if(action === 'pending'){ State.tab = 'pending'; render(); pullAll(false); return; }
    if(action === 'browse'){
      const zone = $('zone'); if(zone) zone.scrollIntoView({behavior:'smooth',block:'start'}); return;
    }
    if(q){
      q.placeholder = action === 'spec' ? '貼上規格，例如 Jersey 88% Polyester 12% Spandex 190gsm' : '輸入布號或款號，例如 AW-1164';
      q.scrollIntoView({behavior:'smooth',block:'center'}); q.focus();
    }
  });
  const go = $('go'); if(go) go.onclick = runSearch;
  const clr = $('clr'); if(clr) clr.onclick = () => { State.search.q=''; State.search.result=null; render(); };
  ['back','clr2','clr3'].forEach(id => { const b = $(id); if(b) b.onclick = () => { State.search.result = null; render(); }; });
  host.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { State.search.type = b.dataset.type; render(); });
  host.querySelectorAll('[data-fib]').forEach(b => b.onclick = () => {
    const k = b.dataset.fib;
    State.search.fibers.has(k) ? State.search.fibers.delete(k) : State.search.fibers.add(k);
    State.search.adv = true; render();
  });
  const advt = $('advt'); if(advt) advt.onclick = () => { State.search.adv = !State.search.adv; render(); };
  const gs = $('gsmsel'); if(gs){ gs.value = State.search.gsm; gs.onchange = e => { State.search.gsm = e.target.value; State.search.adv = true; render(); }; }
  const ss = $('sortsel'); if(ss){ ss.value = State.search.sort; ss.onchange = e => { State.search.sort = e.target.value; State.search.adv = true; render(); }; }

  host.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(b.dataset.copy, '已複製布號 ' + b.dataset.copy));
  host.querySelectorAll('[data-copypath]').forEach(b => b.onclick = () =>
    copy(CONFIG.UNC + '\\' + b.dataset.copypath, '已複製路徑，貼到檔案總管開啟'));
  /* 找不到 → 找代用 / 通知 */
  const fsi = $('fsi-go');

function commitRow(idx, pickCode, silent){
  const r = State.excel.rows[idx];
  if(!r) return;
  if(!r.key){ if(!silent) toast('這列沒有款號，無法採用','or'); return; }
  const useCode = pickCode || r.matchCode || r.code;
  const f = findFabric(useCode);
  if(!f){ if(!silent) toast('公檔沒有這塊布','or'); return; }
  const isSub = !!pickCode;
  const s = {
    style:r.style, bom:r.bom, brand:'DICKS', season:r.season,
    main:{ code:f.code, originalCode: isSub ? (r.code || null) : null,
           originalSpec: isSub ? { sub:r.sub, comp:r.comp, gsm:r.gsm } : null },
    accessories:[], committedBy:userName(), committedAt:new Date().toISOString()
  };
  saveStyle(r.key, s);
  r.committed = true;
  logHistory({ action: isSub ? 'commit_substitute' : 'commit_main',
    style:r.style, bom:r.bom, code:f.code, original: isSub ? r.code : '', source:State.excel.fileName || 'Excel' });
  if(!silent){ toast(isSub ? '已採用代用布 ' + f.code : '已採用 ' + f.code, 'gn'); render(); }
}

/* 找代用布 → 採用到款號（負責人手動登記主布 / 配布 / 代用主布） */
function commitFabricToStyle(code, role, styleKeyRaw, originalCode, specCtx){
  const f = findFabric(code);
  if(!f){ toast('公檔沒有這塊布','or'); return false; }
  const key = (styleKeyRaw||'').trim();
  if(!key){ toast('款號必填','or'); return false; }
  const styleNo = key.split('_')[0];
  const bom = key.includes('_') ? key.split('_').slice(1).join('_') : '';
  let s = Store.get('style:'+key) || { style:styleNo, bom, brand:'DICKS', season:'', main:null, accessories:[], committedBy:userName(), committedAt:new Date().toISOString() };
  s.committedBy = userName(); s.committedAt = new Date().toISOString();
  if(role === 'acc'){
    s.accessories = s.accessories || [];
    if(s.accessories.some(a => normCode(a.code) === f.key)){ toast('這款已經有這塊配布','or'); return false; }
    s.accessories.push({ code:f.code });
    saveStyle(key, s);
    logHistory({ action:'add_accessory', style:styleNo, bom, code:f.code, source:'找代用布→採用' });
  } else {
    const isSub = role === 'sub';
    const oc = isSub ? (originalCode||'').trim() : '';
    const origText = oc || (isSub && specCtx ? (specCtx.text||'') : '');
    s.main = { code:f.code, originalCode: isSub ? (origText||null) : null,
               originalSpec: (isSub && specCtx) ? { sub:specCtx.sub||'', comp:specCtx.comp||'', gsm:(specCtx.gsm!=null?specCtx.gsm:null) } : null };
    saveStyle(key, s);
    logHistory({ action: isSub ? 'commit_substitute' : 'commit_main', style:styleNo, bom, code:f.code, original: isSub ? origText : '', source:'找代用布→採用' });
  }
  toast('已採用 '+f.code+' 到 '+key,'gn');
  State.search.result = { kind:'style', key }; render();
  return true;
}

function readExcel(file){
  const fr = new FileReader();
  fr.onload = e => {
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      const sn = wb.SheetNames[0];
      const raw = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'' });
      if(!raw.length){ toast('這個檔案是空的','rd'); return; }
      // 找標題列：前 12 列中欄位命中最多的那一列
      let best = 0, bestScore = -1;
      for(let i = 0; i < Math.min(12, raw.length); i++){
        const c = detectCols(raw[i]);
        const n = Object.keys(c).length;
        if(n > bestScore){ bestScore = n; best = i; }
      }
      State.excel.raw = raw;
      State.excel.headerIdx = best;
      State.excel.headerRow = raw[best];
      State.excel.cols = detectCols(raw[best]);
      State.excel.fileName = file.name;
      State.excel.sheetName = sn;
      State.excel.filter = 'all';
      State.excel.expanded = null;
      buildExcelRows();
      logHistory({ action:'excel_import', source:file.name, label:State.excel.rows.length + ' 列' });
      toast('讀到 ' + State.excel.rows.length + ' 列','gn');
      render();
    }catch(err){ toast('讀檔失敗：' + err.message,'rd'); }
  };
  fr.readAsArrayBuffer(file);
}

      const raw = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'' });
      let best = 0, bestScore = -1;
      for(let i = 0; i < Math.min(12, raw.length); i++){
        const c = detectCols(raw[i]); const n = Object.keys(c).length;
        if(n > bestScore){ bestScore = n; best = i; }
      }
      const cols = detectCols(raw[best]);
      if(cols.code === undefined){ toast('找不到布號欄，請確認表頭','rd'); return; }
      const add = [], seen = new Set(DATA.map(f => f.key));
      let dup = 0, skip = 0;
      for(let i = best+1; i < raw.length; i++){
        const r = raw[i]; if(!r) continue;
        const cell = k => (cols[k] === undefined ? '' : String(r[cols[k]] ?? '').trim());
        const code = cell('code');
        if(!code){ skip++; continue; }
        const key = normCode(code);
        if(seen.has(key)){ dup++; continue; }
        seen.add(key);
        const gsmRaw = cell('gsm');
        const sub = cell('sub') || null;
        const KNIT = /jersey|tricot|interlock|knit|rib|fleece|terry|ponte|mesh|jacquard/i;
        add.push({ code, sub, comp: cell('comp') || null,
          gsm: gsmRaw ? (parseInt(String(gsmRaw).replace(/[^\d]/g,''),10) || null) : null,
          type: sub ? (KNIT.test(sub) ? 'Knit' : 'Woven') : 'Woven', src:['excel'] });
      }
      State.lib.pending = { fileName:file.name, total:raw.length - best - 1, add, dup, skip };
      render();
    }catch(err){ toast('讀檔失敗：' + err.message,'rd'); }
  };
  fr.readAsArrayBuffer(file);
}

function exportFabrics(){
  const rows = visible().map(f => ({
    '布號':f.code,'布種':f.sub||'','類別':f.type,'成分':f.comp||'',
    '克重(gsm)':f.gsm==null?'':f.gsm,'含彈性':f.spandex?'Y':'N','來源':(f.src||[]).join('+')
  }));
  if(!rows.length){ toast('沒有結果可匯出','or'); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'DICKS');
  XLSX.writeFile(wb, 'DICKS_fabric_' + today() + '.xlsx');
  toast('已匯出 ' + rows.length + ' 筆','gn');
}
function exportHistory(){
  let list = Store.get('history') || [];
  if(State.history.action !== 'all') list = list.filter(h => h.action === State.history.action);
  if(State.history.q){ const q = State.history.q.toLowerCase(); list = list.filter(h => JSON.stringify(h).toLowerCase().includes(q)); }
  if(!list.length){ toast('沒有紀錄可匯出','or'); return; }
  const rows = list.map(h => ({
    '時間':h.ts||'','操作':ACTION_LABEL[h.action]||h.action||'','操作人員':h.user||'',
    '款號':h.style||'','BOM':h.bom||'','布號':h.code||'','原指定':h.original||'','來源':h.source||''
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'History');
  XLSX.writeFile(wb, 'DICKS_history_' + today() + '.xlsx');
  toast('已匯出 ' + rows.length + ' 筆','gn');
}
